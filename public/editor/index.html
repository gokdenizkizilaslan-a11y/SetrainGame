<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Setra Game — Content Editor</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-title">The Setra Game <span>· content editor</span></div>
  <div class="topbar-actions">
    <button id="btn-discard" class="btn ghost" title="Throw away unsaved changes and reload">Discard</button>
    <button id="btn-save" class="btn primary" disabled>Save to content.js</button>
  </div>
</header>
<div id="banner" class="banner hidden"></div>
<div class="layout">
  <nav id="sidebar" class="sidebar"></nav>
  <main id="content" class="content"></main>
</div>
<div id="modal-root"></div>
<script src="editor.js"></script>
</body>
</html>
